<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Engineering Weekly</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input {
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            padding: 0.75rem;
            background-color: #0ea5e9;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        #message {
            margin-top: 1rem;
            font-weight: bold;
            display: none;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Engineering Weekly</h1>
        <p>Get the latest AI models, frameworks, and architecture deep-dives curated by a custom LangGraph agent. Sent every Friday.</p>
        
        <form id="subscribeForm">
            <input type="email" id="emailInput" placeholder="engineer@example.com" required>
            <button type="submit" id="submitBtn">Subscribe Now</button>
        </form>

        <div id="message"></div>
    </div>

    <script>
        document.getElementById('subscribeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.textContent = "Subscribing...";
            messageDiv.style.display = 'none';

            try {
                // Pointing to your FastAPI endpoint
                const response = await fetch('/subscribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                messageDiv.style.display = 'block';
                if (response.ok) {
                    messageDiv.textContent = "✅ Successfully Subscribed!";
                    messageDiv.className = 'success';
                    document.getElementById('subscribeForm').reset();
                } else {
                    messageDiv.textContent = "❌ " + (data.detail || data.message || "An error occurred.");
                    messageDiv.className = 'error';
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.textContent = "❌ Failed to connect to the server.";
                messageDiv.className = 'error';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Subscribe Now";
            }
        });
    </script>
</body>
</html>
